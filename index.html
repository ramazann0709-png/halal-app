<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Халяль Финансы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #0d9488;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      box-sizing: border-box;
      padding-bottom: 40px;
    }
    .card {
      background: linear-gradient(135deg, #134e4a 0%, #0f766e 100%);
      padding: 20px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(13, 148, 136, 0.2);
      margin-bottom: 20px;
    }
    .balance-label { font-size: 14px; color: #99f6e4; margin: 0; }
    .balance-value { font-size: 32px; font-weight: 700; margin: 8px 0; }
    .nisaab-status { font-size: 13px; margin: 0; color: #ccfbf1; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }
    .btn {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      color: var(--text);
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:active { background-color: #334155; }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      margin: 24px 0 12px 0;
    }

    .chart-container {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #expenseChart {
      max-width: 260px;
      max-height: 260px;
    }

    .goal-card {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 10px;
    }
    .goal-info { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
    .progress-bar { background-color: #334155; border-radius: 8px; height: 8px; overflow: hidden; }
    .progress-fill { background: linear-gradient(90deg, #0d9488, #10b981); height: 100%; }

    /* Список истории */
    .history-item {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-cat { font-size: 15px; font-weight: 600; margin: 0; }
    .history-date { font-size: 12px; color: var(--muted); margin: 2px 0 0 0; }
    .history-amount { font-size: 16px; font-weight: 700; }
    .income-val { color: var(--accent); }
    .expense-val { color: var(--danger); }

    /* Всплывающие окна */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      box-sizing: border-box;
    }
    .modal h3 { margin-top: 0; margin-bottom: 16px; font-size: 18px; }
    .input-field {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: var(--text);
      font-size: 16px;
      box-sizing: border-box;
    }
    .modal-btns { display: flex; gap: 10px; margin-top: 8px; }
    .btn-submit {
      flex: 1;
      background: var(--primary);
      border: none;
      color: white;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-cancel {
      flex: 1;
      background: transparent;
      border: 1px solid #475569;
      color: var(--muted);
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <p class="balance-label">Свободный баланс</p>
    <div class="balance-value" id="balance-text">0 ₽</div>
    <p class="nisaab-status" id="nisaab-text">Расчет закята...</p>
  </div>

  <div class="actions">
    <button class="btn" onclick="openModal('modal-income')">➕ Доход</button>
    <button class="btn" onclick="openModal('modal-expense')">➖ Расход</button>
    <button class="btn" onclick="openModal('modal-goal')">🎯 Новая цель</button>
    <button class="btn" onclick="openModal('modal-fund')">💰 В копилку</button>
  </div>

  <div class="section-title">📊 Аналитика расходов</div>
  <div class="chart-container">
    <canvas id="expenseChart"></canvas>
    <p id="no-chart-data" style="color: var(--muted); font-size: 14px; margin: 10px 0 0 0; display: none;">Расходов пока нет</p>
  </div>

  <div class="section-title">🎯 Цели накопления</div>
  <div id="goals-container">
    <p style="color: var(--muted); font-size: 14px;">Целей пока нет</p>
  </div>

  <div class="section-title">⏱ История операций</div>
  <div id="history-container">
    <p style="color: var(--muted); font-size: 14px;">Операций пока нет</p>
  </div>

  <!-- Модалка Дохода -->
  <div class="modal-overlay" id="modal-income">
    <div class="modal">
      <h3>Записать доход</h3>
      <input type="number" id="income-amount" class="input-field" placeholder="Сумма (₽)">
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal('modal-income')">Отмена</button>
        <button class="btn-submit" onclick="submitIncome()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Модалка Расхода -->
  <div class="modal-overlay" id="modal-expense">
    <div class="modal">
      <h3>Записать расход</h3>
      <input type="number" id="expense-amount" class="input-field" placeholder="Сумма (₽)">
      <select id="expense-category" class="input-field">
        <option value="Еда">🍔 Еда</option>
        <option value="Транспорт">🚕 Транспорт</option>
        <option value="Лекарства">💊 Лекарства</option>
        <option value="Дом">🏠 Дом / Быт</option>
        <option value="Одежда">👕 Одежда</option>
        <option value="Разное">📦 Разное</option>
      </select>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal('modal-expense')">Отмена</button>
        <button class="btn-submit" onclick="submitExpense()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Модалка Новой цели -->
  <div class="modal-overlay" id="modal-goal">
    <div class="modal">
      <h3>Новая цель</h3>
      <input type="text" id="goal-name" class="input-field" placeholder="Название (напр. Хадж)">
      <input type="number" id="goal-target" class="input-field" placeholder="Целевая сумма (₽)">
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal('modal-goal')">Отмена</button>
        <button class="btn-submit" onclick="submitGoal()">Создать</button>
      </div>
    </div>
  </div>

  <!-- Модалка Пополнения копилки -->
  <div class="modal-overlay" id="modal-fund">
    <div class="modal">
      <h3>Пополнить копилку</h3>
      <select id="fund-goal-select" class="input-field"></select>
      <input type="number" id="fund-amount" class="input-field" placeholder="Сумма с баланса (₽)">
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal('modal-fund')">Отмена</button>
        <button class="btn-submit" onclick="submitFund()">Перевести</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const userId = tg?.initDataUnsafe?.user?.id || 0;
    const API_URL = "https://donor-excluded-afternoon-wake.trycloudflare.com";

    let chartInstance = null;

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function refreshData() {
      try {
        const res = await fetch(`${API_URL}/api/data?user_id=${userId}`);
        const data = await res.json();
        
        // Баланс и закят
        document.getElementById('balance-text').innerText = `${data.balance.toLocaleString('ru-RU')} ₽`;
        const nisaabEl = document.getElementById('nisaab-text');
        if (data.zakat > 0) {
          nisaabEl.innerText = `Нисаб пройден! Обязательный закят: ${data.zakat.toLocaleString('ru-RU')} ₽`;
          nisaabEl.style.color = '#34d399';
        } else {
          nisaabEl.innerText = `Нисаб (${data.nisaab.toLocaleString('ru-RU')} ₽) не достигнут`;
          nisaabEl.style.color = '#ccfbf1';
        }

        // Обновление графика
        renderChart(data.categories || []);

        // Цели
        const goalsContainer = document.getElementById('goals-container');
        const select = document.getElementById('fund-goal-select');
        select.innerHTML = '';

        if (data.goals && data.goals.length > 0) {
          goalsContainer.innerHTML = '';
          data.goals.forEach(g => {
            const percent = Math.min(100, Math.round((g.current / g.target) * 100)) || 0;
            goalsContainer.innerHTML += `
              <div class="goal-card">
                <div class="goal-info">
                  <strong>${g.name}</strong>
                  <span>${g.current.toLocaleString('ru-RU')} / ${g.target.toLocaleString('ru-RU')} ₽ (${percent}%)</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill" style="width: ${percent}%;"></div>
                </div>
              </div>
            `;
            select.innerHTML += `<option value="${g.id}" data-name="${g.name}">${g.name}</option>`;
          });
        } else {
          goalsContainer.innerHTML = `<p style="color: var(--muted); font-size: 14px;">Целей пока нет</p>`;
        }

        // История операций
        const historyContainer = document.getElementById('history-container');
        if (data.history && data.history.length > 0) {
          historyContainer.innerHTML = '';
          data.history.forEach(t => {
            const isInc = t.type === 'income';
            historyContainer.innerHTML += `
              <div class="history-item">
                <div>
                  <p class="history-cat">${t.category}</p>
                  <p class="history-date">${t.date}</p>
                </div>
                <span class="history-amount ${isInc ? 'income-val' : 'expense-val'}">
                  ${isInc ? '+' : '-'}${t.amount.toLocaleString('ru-RU')} ₽
                </span>
              </div>
            `;
          });
        } else {
          historyContainer.innerHTML = `<p style="color: var(--muted); font-size: 14px;">Операций пока нет</p>`;
        }

      } catch (err) {
        console.error("Ошибка загрузки данных:", err);
      }
    }

    function renderChart(categories) {
      const ctx = document.getElementById('expenseChart').getContext('2d');
      const noDataEl = document.getElementById('no-chart-data');

      if (categories.length === 0) {
        if (chartInstance) chartInstance.destroy();
        document.getElementById('expenseChart').style.display = 'none';
        noDataEl.style.display = 'block';
        return;
      }

      document.getElementById('expenseChart').style.display = 'block';
      noDataEl.style.display = 'none';

      const labels = categories.map(c => c.category);
      const values = categories.map(c => c.total);

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: ['#0d9488', '#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6', '#10b981'],
            borderWidth: 2,
            borderColor: '#1e293b'
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#f8fafc', boxWidth: 12, padding: 12 }
            }
          }
        }
      });
    }

    async function submitIncome() {
      const amount = parseFloat(document.getElementById('income-amount').value);
      if (!amount || amount <= 0) return alert('Введите сумму');
      
      await fetch(`${API_URL}/api/transaction`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user_id: userId, type: 'income', category: 'Пополнение', amount })
      });
      document.getElementById('income-amount').value = '';
      closeModal('modal-income');
      refreshData();
    }

    async function submitExpense() {
      const amount = parseFloat(document.getElementById('expense-amount').value);
      const category = document.getElementById('expense-category').value;
      if (!amount || amount <= 0) return alert('Введите сумму');
      
      await fetch(`${API_URL}/api/transaction`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user_id: userId, type: 'expense', category, amount })
      });
      document.getElementById('expense-amount').value = '';
      closeModal('modal-expense');
      refreshData();
    }

    async function submitGoal() {
      const name = document.getElementById('goal-name').value.trim();
      const target = parseFloat(document.getElementById('goal-target').value);
      if (!name || !target) return alert('Заполните поля');

      await fetch(`${API_URL}/api/goal`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user_id: userId, name, target })
      });
      document.getElementById('goal-name').value = '';
      document.getElementById('goal-target').value = '';
      closeModal('modal-goal');
      refreshData();
    }

    async function submitFund() {
      const select = document.getElementById('fund-goal-select');
      const goalId = select.value;
      const goalName = select.options[select.selectedIndex]?.getAttribute('data-name');
      const amount = parseFloat(document.getElementById('fund-amount').value);
      if (!goalId || !amount) return alert('Заполните поля');

      await fetch(`${API_URL}/api/fund`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user_id: userId, goal_id: goalId, goal_name: goalName, amount })
      });
      document.getElementById('fund-amount').value = '';
      closeModal('modal-fund');
      refreshData();
    }

    refreshData();
  </script>
</body>
</html>
